<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <div class="input-container">
            <input type="text" name=""  id="todo-input" placeholder="Enter a new task">
            <button id="add-task-btn">Add <br> Task</button>
        </div>
        <ul id="todo-list">
            <div>
                <p>Total <span class="total">0</span></p>
                <p>Completed <span class="comp">0</span></p>
                <p>Pending <span class="pending">0</span></p>
            </div>
            <!-- Tasks will be added here dynamically -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
